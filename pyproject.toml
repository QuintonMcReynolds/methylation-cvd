[project]
name = "methylation-cvd"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "E741", "N803", "N806"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["mcvd"]
